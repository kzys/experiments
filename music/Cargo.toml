[package]
name = "music"
version = "0.1.0"
edition = "2024"

[dependencies]
ureq = { version = "2", features = ["json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
libc = "0.2"
wayland-client = "0.31"
wayland-protocols = { version = "0.31", features = ["client"] }
input-linux = "0.7"
fontdue = "0.9"
