[package]
name = "music"
version = "0.1.0"
edition = "2024"

[dependencies]
ureq = { version = "2", features = ["json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
libc = "0.2"
input-linux = "0.7"
egui = "0.35"
egui-winit = { version = "0.35", default-features = false }
egui_glow = { version = "0.35", features = ["winit"] }
glutin = { version = "0.32", default-features = false, features = ["egl", "wayland"] }
glutin-winit = { version = "0.5", default-features = false, features = ["egl", "wayland"] }
