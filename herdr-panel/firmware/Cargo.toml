[package]
name = "herdr-panel-firmware"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
embassy-executor = { version = "0.10", features = ["nightly"] }
embassy-sync = "0.8"
embassy-time = "0.5"
esp-alloc = "0.11"
esp-backtrace = { version = "0.20.0", features = ["esp32s3", "panic-handler", "println"] }
esp-bootloader-esp-idf = { version = "0.6", features = ["esp32s3"] }
esp-hal = { version = "1.2", features = ["unstable", "esp32s3"] }
esp-println = { version = "0.18.0", default-features = false, features = ["esp32s3", "log-04", "jtag-serial"] }
esp-radio-rtos-driver = "0.4"
esp-rtos = { version = "0.4", features = ["embassy", "esp32s3", "esp-radio", "esp-alloc", "log-04"] }
esp-sync = { version = "0.3", features = ["esp32s3"] }
herdr-panel-art = { path = "../art" }
herdr-panel-protocol = { path = "../protocol" }
log = "0.4"
oxivgl = { version = "0.9.2", default-features = false, features = ["esp-hal", "esp32s3", "log-04", "rtos-sem"] }
oxivgl-sys = { version = "0.2", default-features = false }
serde-json-core = "0.6"
static_cell = { version = "2", features = ["nightly"] }

[build-dependencies]
cc = "1"
herdr-panel-art = { path = "../art" }
herdr-panel-scene = { path = "../scene" }
oxivgl-build = "0.1.2"
png = "0.17"

[profile.release]
opt-level = 2
debug = true

[workspace]
