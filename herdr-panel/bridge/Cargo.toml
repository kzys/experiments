[package]
name = "herdr-panel-bridge"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
chrono = { version = "0.4.42", default-features = false, features = ["clock"] }
herdr-panel-protocol = { path = "../protocol" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serialport = { version = "4", default-features = false }
